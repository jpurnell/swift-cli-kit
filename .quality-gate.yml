# The examples executable is still excluded, for one reason only: its ~316
# print() calls are the program's terminal output, and logging.print-statement
# has no per-target notion of a CLI (projectType is repo-wide). Every other
# finding the exclusion used to hide has been fixed; run with this block removed
# to confirm only logging.print-statement / no-os-logger-import remain.
excludePatterns:
  - "swiftclikit-examples"

docTarget: SwiftCLIKit

consistency:
  corpusPath: ../org-judgement-corpus
  projectID: SwiftCLIKit
  consistencyThreshold: 0.7
  defaultRiskTier: 2

# v2 layout: the master plan is project-owned, not framework content.
status:
  guidelinesPath: "."
  masterPlanPath: project/master_plan.md

# Refuse to trust a gate binary older than this. A stale binary silently runs
# old rules; without this pin nothing says so. Ratchet on each deploy that the
# repo depends on. Warns on every run; fails only under --strict.
minimumGateVersion: "2026-08-26"
